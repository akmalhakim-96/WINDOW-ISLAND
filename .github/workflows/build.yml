name: Build Windows app

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'app/**'
      - 'installer/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Work out version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = ([xml](Get-Content app/WindowIsland/WindowIsland.csproj)).Project.PropertyGroup.Version | Select-Object -First 1 }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Version $v"

      - name: Publish (self-contained, single file, ReadyToRun)
        run: >
          dotnet publish app/WindowIsland/WindowIsland.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -p:DebugType=none
          -p:Version=${{ env.VERSION }}
          -o publish

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=..\publish" installer\WindowIsland.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "dist\WindowIsland-Setup-$env:VERSION.exe" "dist\WindowIsland-Setup.exe"
          Compress-Archive -Path publish\WindowIsland.exe -DestinationPath "dist\WindowIsland-Portable-$env:VERSION.zip"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Smoke test (app starts and stays up)
        shell: pwsh
        run: |
          $p = Start-Process publish\WindowIsland.exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            Write-Host "App exited early with code $($p.ExitCode)"
            Get-Content "$env:APPDATA\WindowIsland\log.txt" -ErrorAction SilentlyContinue
            exit 1
          }
          $proc = Get-Process -Id $p.Id
          $ws = [math]::Round($proc.WorkingSet64 / 1MB); $priv = [math]::Round($proc.PrivateMemorySize64 / 1MB)
          Write-Host "Running OK. Working set: $ws MB, private: $priv MB, windows: $((Get-Process -Id $p.Id).MainWindowTitle)"
          $log = Get-Content "$env:APPDATA\WindowIsland\log.txt" -ErrorAction SilentlyContinue
          $log
          # Screenshot of the real desktop (uploaded as an artifact for review)
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force shots | Out-Null
          $bmp.Save("shots\desktop.png")
          # Overlap check from the layout the app logged
          $last = ($log | Select-String 'Layout usable=' | Select-Object -Last 1).Line
          if ($last) {
            $rects = @{}
            foreach ($m in [regex]::Matches(($last -split '\|')[1], '(\w+)=(-?\d+),(-?\d+),(\d+),(\d+)')) {
              $rects[$m.Groups[1].Value] = [int[]]@($m.Groups[2].Value, $m.Groups[3].Value, $m.Groups[4].Value, $m.Groups[5].Value)
            }
            $keys = @($rects.Keys); $bad = 0
            for ($i = 0; $i -lt $keys.Count; $i++) { for ($j = $i + 1; $j -lt $keys.Count; $j++) {
              $a = $rects[$keys[$i]]; $c = $rects[$keys[$j]]
              if ($a[0] -lt $c[0] + $c[2] -and $c[0] -lt $a[0] + $a[2] -and $a[1] -lt $c[1] + $c[3] -and $c[1] -lt $a[1] + $a[3]) { Write-Host "OVERLAP: $($keys[$i]) & $($keys[$j])"; $bad++ }
            } }
            Write-Host "Widgets checked: $($keys.Count), overlaps: $bad"
            if ($bad -gt 0) { Start-Process publish\WindowIsland.exe -ArgumentList '--quit' -Wait; exit 1 }
          } else { Write-Host "No layout line in log"; exit 1 }
          if ($log -match '\[ERROR\]') { Write-Host "Errors found in app log"; Start-Process publish\WindowIsland.exe -ArgumentList '--quit' -Wait; exit 1 }
          Start-Process publish\WindowIsland.exe -ArgumentList '--quit' -Wait
          Start-Sleep -Seconds 2
          if (-not $p.HasExited) { Write-Host "Graceful quit failed"; Stop-Process -Id $p.Id -Force; exit 1 }
          Write-Host "Graceful quit OK"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot
          path: shots/*
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: WindowIsland-${{ env.VERSION }}
          path: dist/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Window Island ${{ env.VERSION }}
          files: dist/*
          generate_release_notes: true
